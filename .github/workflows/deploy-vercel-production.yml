# Prepared but DISABLED until Vercel owner completes the handoff.
#
# Security: never enable this workflow before protecting the production
# environment and the main branch. Never commit a Vercel token to the repo.
# See docs/vercel-ci-handoff.md.
name: Deploy existing Vercel project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biu-racing-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'BIU-Racing/document-system' && github.ref == 'refs/heads/main' && vars.VERCEL_AUTO_DEPLOY == 'enabled' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@4992456781334f2795ae9dd169f5041797d85689 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without Vercel credentials
        run: npm ci --include=dev --include=optional --no-audit --no-fund

      - name: Prepare verified templates
        run: npm run templates:prepare

      - name: Validate before deployment
        run: |
          npm run check
          npm run catalog:check
          npm run build

      - name: Check deployment configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_CLI_VERSION VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions configuration: ${name}"
              exit 1
            fi
          done

      - name: Install reviewed Vercel CLI version
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for existing production project
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Stage, inspect, and promote the deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          vercel inspect "$deployment_url"
          vercel promote "$deployment_url"
